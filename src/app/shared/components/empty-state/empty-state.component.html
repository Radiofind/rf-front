<div class="empty">
  @if (emptyIconClass()) {
    <app-icon
      iconMinWidth="64px"
      iconHeight="64px"
      iconBorderRadius="50%"
      iconFontSize="32px"
      [iconClass]="emptyIconClass()"
    />
  }

  <p class="empty__title">{{ emptyTitle() }}</p>

  @if (emptyDescription()) {
    <p class="empty__description">{{ emptyDescription() }}</p>
  }
</div>
