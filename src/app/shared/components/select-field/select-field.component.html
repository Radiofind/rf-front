<div class="select" [class.select--disabled]="disabled()" [class.select--open]="isOpen()">
  <button
    class="select__control"
    type="button"
    [id]="controlId"
    [attr.name]="name() || null"
    [disabled]="disabled()"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [attr.aria-describedby]="describedBy()"
    [appDropdownTriggerFor]="dropdown"
    (cdkMenuOpened)="onOpen()"
    (cdkMenuClosed)="onClose()"
  >
    <span class="select__value" [class.select__value--placeholder]="!selectedOption()">
      {{ selectedOption()?.label ?? placeholder() }}
    </span>
    <i class="select__arrow bx bx-chevron-down" aria-hidden="true"></i>
  </button>

  <app-dropdown-menu
    #dropdown="appDropdownMenu"
    [options]="options()"
    [selectedValue]="value()"
    (optionSelect)="onSelect($event)"
  />
</div>
