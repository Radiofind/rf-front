<header class="header" [class.header--extended]="isMainApplication()">
  <div class="header-brand">
    <img class="header-logo" src="/assets/images/audiowave.png" [alt]="'common.logo' | translate" />
    <span class="header-title">RADIOFIND</span>
  </div>

  @if (isMainApplication()) {
    <div class="header-main">
      <div class="header-search">
        <i class="header-search-icon bx bx-search"></i>
        <input
          class="header-search-input"
          type="text"
          name="search"
          [attr.aria-label]="'header.searchLabel' | translate"
          [placeholder]="'header.searchPlaceholder' | translate"
          [value]="searchValue()"
          (input)="onSearchInput($event)"
        />
        @if (searchValue()) {
          <button
            class="header-search-clear"
            type="button"
            [attr.aria-label]="'header.clearSearch' | translate"
            (click)="onClearSearch()"
          >
            <i class="bx bx-x"></i>
          </button>
        }
      </div>

      <div class="header-actions">
        <div class="header-premium">
          <app-button
            additionalClass="button--premium"
            [contentText]="'header.upgrade' | translate"
            contentIconClass="bxf bx-star"
            (clickAction)="onUpgrade()"
          />
        </div>

        <app-popover
          #messagesPopover="appPopover"
          [popoverTitle]="'header.messages' | translate"
          (opened)="onMessages()"
        >
          <button
            class="header-action"
            type="button"
            [attr.aria-label]="'header.messages' | translate"
            aria-haspopup="dialog"
            [attr.aria-expanded]="messagesPopover.isOpen()"
          >
            <i class="bx bx-envelope-alt"></i>
            @if (hasUnreadMessages()) {
              <span class="header-action-badge"></span>
            }
          </button>

          <ng-template appPopoverContent>
            <app-empty-state
              emptyIconClass="bx bx-inbox"
              [emptyTitle]="'header.noMessagesTitle' | translate"
              [emptyDescription]="'header.noMessagesDescription' | translate"
            />
          </ng-template>
        </app-popover>

        <app-popover
          #notificationsPopover="appPopover"
          [popoverTitle]="'header.notifications' | translate"
          (opened)="onNotifications()"
        >
          <button
            class="header-action"
            type="button"
            [attr.aria-label]="'header.notifications' | translate"
            aria-haspopup="dialog"
            [attr.aria-expanded]="notificationsPopover.isOpen()"
          >
            <i class="bx bx-bell"></i>
            @if (hasUnreadNotifications()) {
              <span class="header-action-badge"></span>
            }
          </button>

          <ng-template appPopoverContent>
            <app-empty-state
              emptyIconClass="bx bx-bell"
              [emptyTitle]="'header.caughtUpTitle' | translate"
              [emptyDescription]="'header.caughtUpDescription' | translate"
            />
          </ng-template>
        </app-popover>

        <app-popover
          #profilePopover="appPopover"
          [popoverPosition]="profileMenuPosition"
          panelWidth="248px"
          panelClass="popover--menu"
          (opened)="onProfile()"
        >
          <button
            class="header-profile"
            type="button"
            [attr.aria-label]="'header.profile' | translate"
            aria-haspopup="menu"
            [attr.aria-expanded]="profilePopover.isOpen()"
          >
            @if (userAvatarUrl()) {
              <img
                class="header-profile-image"
                [src]="userAvatarUrl()"
                [alt]="'common.userAvatar' | translate"
              />
            } @else {
              <i class="bxf bx-user"></i>
            }
            @if (isUserOnline()) {
              <span class="header-profile-status"></span>
            }
          </button>

          <ng-template appPopoverContent>
            <ul
              class="header-menu"
              role="menu"
              [attr.aria-label]="'header.accountMenu' | translate"
            >
              @for (item of profileMenuItems; track item.id) {
                <li [class]="item.visibilityClass">
                  <button
                    class="header-menu-item {{ item.additionalClass }}"
                    type="button"
                    role="menuitem"
                    (click)="onProfileMenuItemSelect(item.id); profilePopover.close()"
                  >
                    <i class="header-menu-item-icon" [class]="item.iconClass"></i>
                    <span class="header-menu-item-label">{{ item.label | translate }}</span>
                  </button>
                </li>
              }
            </ul>
          </ng-template>
        </app-popover>
      </div>
    </div>
  }
</header>
