<header class="header" [class.header--extended]="isMainApplication()">
  <div class="header-brand">
    <img class="header-logo" src="/assets/images/audiowave.png" alt="Logo" />
    <span class="header-title">RADIOFIND</span>
  </div>

  @if (isMainApplication()) {
    <div class="header-main">
      <div class="header-search">
        <i class="header-search-icon bx bx-search"></i>
        <input
          class="header-search-input"
          type="text"
          aria-label="Search artists, songs, genres"
          placeholder="Search artists, songs, genres..."
          [value]="searchValue()"
          (input)="onSearchInput($event)"
        />
        @if (searchValue()) {
          <button
            class="header-search-clear"
            type="button"
            aria-label="Clear search"
            (click)="onClearSearch()"
          >
            <i class="bx bx-x"></i>
          </button>
        }
      </div>

      <div class="header-actions">
        <div class="header-premium">
          <app-button
            additionalClass="button--premium"
            contentText="Upgrade to Premium"
            contentIconClass="bxf bx-star"
            (clickAction)="onUpgrade()"
          />
        </div>

        <app-popover #messagesPopover="appPopover" popoverTitle="Messages" (opened)="onMessages()">
          <button
            class="header-action"
            type="button"
            aria-label="Messages"
            aria-haspopup="dialog"
            [attr.aria-expanded]="messagesPopover.isOpen()"
          >
            <i class="bx bx-envelope-alt"></i>
            @if (hasUnreadMessages()) {
              <span class="header-action-badge"></span>
            }
          </button>

          <ng-template appPopoverContent>
            <app-empty-state
              emptyIconClass="bx bx-inbox"
              emptyTitle="No messages yet"
              emptyDescription="Messages from listeners, labels and radio stations will show up here."
            />
          </ng-template>
        </app-popover>

        <app-popover
          #notificationsPopover="appPopover"
          popoverTitle="Notifications"
          (opened)="onNotifications()"
        >
          <button
            class="header-action"
            type="button"
            aria-label="Notifications"
            aria-haspopup="dialog"
            [attr.aria-expanded]="notificationsPopover.isOpen()"
          >
            <i class="bx bx-bell"></i>
            @if (hasUnreadNotifications()) {
              <span class="header-action-badge"></span>
            }
          </button>

          <ng-template appPopoverContent>
            <app-empty-state
              emptyIconClass="bx bx-bell"
              emptyTitle="You are all caught up"
              emptyDescription="Track reviews, radio picks and account updates will appear here."
            />
          </ng-template>
        </app-popover>

        <app-popover
          #profilePopover="appPopover"
          [popoverPosition]="profileMenuPosition"
          panelWidth="224px"
          panelClass="popover--menu"
          (opened)="onProfile()"
        >
          <button
            class="header-profile"
            type="button"
            aria-label="Profile"
            aria-haspopup="menu"
            [attr.aria-expanded]="profilePopover.isOpen()"
          >
            @if (userAvatarUrl()) {
              <img class="header-profile-image" [src]="userAvatarUrl()" alt="User avatar" />
            } @else {
              <i class="bxf bx-user"></i>
            }
            @if (isUserOnline()) {
              <span class="header-profile-status"></span>
            }
          </button>

          <ng-template appPopoverContent>
            <ul class="header-menu" role="menu" aria-label="Account menu">
              @for (item of profileMenuItems; track item.id) {
                <li>
                  <button
                    class="header-menu-item {{ item.additionalClass }}"
                    type="button"
                    role="menuitem"
                    (click)="onProfileMenuItemSelect(item.id); profilePopover.close()"
                  >
                    <i class="header-menu-item-icon" [class]="item.iconClass"></i>
                    <span class="header-menu-item-label">{{ item.label }}</span>
                  </button>
                </li>
              }
            </ul>
          </ng-template>
        </app-popover>
      </div>
    </div>
  }
</header>
