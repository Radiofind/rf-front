@if (isLoading()) {
  <div class="loader" role="status" aria-busy="true" aria-live="polite" [attr.aria-label]="loaderAriaLabel">
    <div class="loader__content">
      <app-spinner [size]="spinnerSize" [thickness]="spinnerThickness" [ariaLabel]="loaderAriaLabel" />
      <p class="loader__text">{{ loaderText }}</p>
    </div>
  </div>
}
