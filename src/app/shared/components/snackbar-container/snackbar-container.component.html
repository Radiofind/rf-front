<div
  class="snackbar-container"
  role="status"
  aria-live="polite"
  aria-atomic="false"
  [attr.aria-label]="'common.notifications' | translate"
>
  @for (message of messages(); track message.id) {
    <app-snackbar
      [snackbarContent]="message.content | translate: message.params ?? undefined"
      [snackbarType]="message.type"
      [snackbarIconClass]="message.iconClass"
    />
  }
</div>
