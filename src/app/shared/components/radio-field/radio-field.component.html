<div class="radio-field" [class.radio-field--compact]="isCompact()">
  <div class="radio-field__label">
    <span>{{ fieldLabel() }}</span>
  </div>
  <div class="radio-field__buttons">
    @for (option of options(); track option.value) {
      <label class="radio-field__buttons--option">
        <input
          type="radio"
          [value]="option.value"
          [checked]="value() === option.value"
          [attr.name]="name() || null"
          [disabled]="disabled()"
          (change)="onChange(option.value)"
        />
        <span></span>
        {{ option.label }}
      </label>
    }
  </div>
</div>
