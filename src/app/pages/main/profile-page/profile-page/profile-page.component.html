<div class="profile">
  <app-profile-hero
    [userFullName]="fullName()"
    [artistType]="artistType()"
    [avatarUrl]="avatarUrl()"
    [mainGenres]="mainGenres()"
    [bio]="shortDescription()"
    [socialLinks]="socialLinks()"
    [editable]="true"
    [verified]="true"
    (avatarEdit)="onAvatarEdit()"
    (profileEdit)="onProfileEdit()"
  />

  <app-profile-stats
    [registeredAt]="registeredAt()"
    [uploadsCount]="uploadsCount()"
    [followersCount]="followersCount()"
    [likesCount]="likesCount()"
  />

  <div class="profile__grid">
    <app-profile-details
      class="profile__details"
      [artistType]="artistType()"
      [description]="description()"
      [artistName]="artistName()"
      [birthdayDate]="birthdayDate()"
      [additionalGenres]="additionalGenres()"
      [statisticsVisible]="true"
      (statisticsOpened)="onStatisticsOpen()"
    >
      <app-profile-statistics
        profileStatistics
        [period]="statisticsPeriod()"
        [kpis]="statisticsKpis()"
        [isLoading]="isStatisticsLoading()"
        [hasLoadFailed]="hasStatisticsLoadFailed()"
        (periodSelected)="onStatisticsPeriodSelect($event)"
        (retryClicked)="onStatisticsRetry()"
      />
    </app-profile-details>
    <app-latest-activity class="profile__activity" [activities]="activities()" />
  </div>
</div>
