<div class="profile">
  <app-profile-hero
    [userFullName]="fullName()"
    [artistType]="artistType()"
    [avatarUrl]="avatarUrl()"
    [mainGenres]="mainGenres()"
    [bio]="shortDescription()"
    [socialLinks]="socialLinks()"
    (avatarEdit)="onAvatarEdit()"
    (profileEdit)="onProfileEdit()"
  />

  <app-profile-stats [registeredAt]="registeredAt()" />

  <div class="profile__grid">
    <app-profile-details
      class="profile__details"
      [artistType]="artistType()"
      [description]="description()"
      [artistName]="artistName()"
      [birthdayDate]="birthdayDate()"
      [additionalGenres]="additionalGenres()"
    />
    <app-latest-activity class="profile__activity" />
  </div>
</div>
