<div class="settings">
  <section class="settings__hero" aria-labelledby="settings-title">
    <h1 class="settings__title" id="settings-title">{{ 'settings.title' | translate }}</h1>
    <p class="settings__subtitle">{{ 'settings.subtitle' | translate }}</p>
  </section>

  <div class="settings__body">
    <nav class="settings__nav" [attr.aria-label]="'settings.sections' | translate">
      <ul class="settings__nav-list">
        @for (item of navItems; track item.link) {
          <li>
            <a
              class="settings__nav-item"
              routerLinkActive="settings__nav-item--active"
              ariaCurrentWhenActive="page"
              [routerLink]="item.link"
            >
              <i class="settings__nav-icon" [class]="item.iconClass" aria-hidden="true"></i>
              <span>{{ item.label | translate }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="settings__content">
      <router-outlet />
    </div>
  </div>
</div>
