<div class="error-bg">
  @defer (hydrate never) {
    <app-header />
  }

  <div class="error">
    <div class="error-badge">
      <span class="error-badge__ring"></span>
      <span class="error-badge__ring error-badge__ring--outer"></span>
      <app-icon
        [iconClass]="content().iconClass"
        [iconMinWidth]="'104px'"
        [iconHeight]="'104px'"
        [iconBorderRadius]="'50%'"
        [iconFontSize]="'56px'"
      />
    </div>

    <div class="error-code">{{ content().code }}</div>

    <h1 class="error-title">
      {{ content().title }}<span>{{ content().titleColor }}</span>
    </h1>

    <p class="error-description">{{ content().description }}</p>

    <div class="error-actions">
      <app-button
        [contentText]="homeButtonText"
        [contentIconClass]="homeIconClass"
        (clickAction)="goHome()"
      />
    </div>
  </div>

  <div class="rights">© 2026 RADIOFIND. All rights reserved.</div>
</div>
