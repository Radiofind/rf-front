<div class="description">
  <h1 class="description-title">
    {{ content().title | translate }} <span>{{ content().titleColor | translate }}</span>
    {{ content().smile }}
  </h1>
  <div class="description-instructions">{{ content().instructions | translate }}</div>
  @for (content of content().content; track content.id) {
    <div class="description-content">
      <app-icon
        iconMinWidth="80px"
        iconHeight="80px"
        iconBorderRadius="12px"
        iconFontSize="56px"
        [iconClass]="content.iconClass"
      />
      <div class="description-content__text">
        <div class="description-content__text--title">{{ content.contentTitle | translate }}</div>
        <div class="description-content__text--overview">{{ content.overview | translate }}</div>
      </div>
    </div>
  }
</div>
