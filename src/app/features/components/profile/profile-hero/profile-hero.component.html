<section class="hero" aria-label="Profile overview">
  <div class="hero__avatar">
    <div class="hero__avatar-ring">
      @if (avatarUrl(); as avatarUrl) {
        <img class="hero__avatar-photo" [src]="avatarUrl" alt="User avatar" />
      } @else {
        <div class="hero__avatar-image">
          <i class="bxf bx-user"></i>
        </div>
      }
    </div>

    <button
      class="hero__avatar-edit"
      type="button"
      aria-label="Change avatar"
      title="Change avatar"
      aria-haspopup="dialog"
      (click)="onAvatarEdit()"
    >
      <i class="bx bx-pencil"></i>
    </button>
  </div>

  <div class="hero__info">
    <div class="hero__name-row">
      <h1 class="hero__name">{{ userFullName() }}</h1>
      <i class="hero__verified bxf bx-badge-check" title="Verified artist"></i>
    </div>

    <p class="hero__meta">
      <span>{{ artistRoleLabel() }}</span>
      @if (mainGenres()) {
        <span class="hero__meta-dot" aria-hidden="true"></span>
        <span>{{ mainGenres() }}</span>
      }
    </p>

    <p class="hero__bio">{{ bio() }}</p>

    @if (visibleSocialLinks().length) {
      <ul class="hero__socials" aria-label="Social links">
        @for (link of visibleSocialLinks(); track link.key) {
          <li>
            <a
              class="hero__social"
              target="_blank"
              rel="noopener noreferrer"
              [href]="link.url"
              [attr.aria-label]="link.label"
              [title]="link.label"
            >
              <i [class]="link.iconClass" aria-hidden="true"></i>
            </a>
          </li>
        }
      </ul>
    }
  </div>

  <button class="hero__edit" type="button" aria-label="Edit profile" (click)="onProfileEdit()">
    <i class="bx bx-pencil"></i>
    <span>Edit Profile</span>
  </button>
</section>
