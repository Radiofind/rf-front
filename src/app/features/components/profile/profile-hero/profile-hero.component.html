<section class="hero" [attr.aria-label]="'profile.overview' | translate">
  <div class="hero__avatar">
    <div class="hero__avatar-ring">
      @if (avatarUrl(); as avatarUrl) {
        <img class="hero__avatar-photo" [src]="avatarUrl" [alt]="'common.userAvatar' | translate" />
      } @else {
        <div class="hero__avatar-image">
          <i class="bxf bx-user"></i>
        </div>
      }
    </div>

    <button
      class="hero__avatar-edit"
      type="button"
      [attr.aria-label]="'profile.changeAvatar' | translate"
      [title]="'profile.changeAvatar' | translate"
      aria-haspopup="dialog"
      (click)="onAvatarEdit()"
    >
      <i class="bx bx-pencil"></i>
    </button>
  </div>

  <div class="hero__info">
    <div class="hero__name-row">
      <h1 class="hero__name">{{ userFullName() }}</h1>
      <i
        class="hero__verified bxf bx-badge-check"
        [title]="'profile.verifiedArtist' | translate"
      ></i>
    </div>

    <p class="hero__meta">
      <span>{{ artistRoleLabel() | translate }}</span>
      @if (mainGenres()) {
        <span class="hero__meta-dot" aria-hidden="true"></span>
        <span>{{ mainGenres() }}</span>
      }
    </p>

    <p class="hero__bio">{{ bio() }}</p>

    @if (visibleSocialLinks().length) {
      <ul class="hero__socials" [attr.aria-label]="'profile.socialLinks' | translate">
        @for (link of visibleSocialLinks(); track link.key) {
          <li>
            <a
              class="hero__social"
              target="_blank"
              rel="noopener noreferrer"
              [href]="link.url"
              [attr.aria-label]="link.label"
              [title]="link.label"
            >
              <i [class]="link.iconClass" aria-hidden="true"></i>
            </a>
          </li>
        }
      </ul>
    }
  </div>

  <button
    class="hero__edit"
    type="button"
    [attr.aria-label]="'profile.editProfile' | translate"
    (click)="onProfileEdit()"
  >
    <i class="bx bx-pencil"></i>
    <span>{{ 'profile.editProfile' | translate }}</span>
  </button>
</section>
