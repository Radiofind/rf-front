<section class="hero" aria-label="Profile overview">
  <div class="hero__avatar">
    <div class="hero__avatar-ring">
      <div class="hero__avatar-image">
        <i class="bxf bx-user"></i>
      </div>
    </div>

    <button
      class="hero__avatar-edit"
      type="button"
      aria-label="Change avatar"
      title="Change avatar"
    >
      <i class="bx bx-pencil"></i>
    </button>
  </div>

  <div class="hero__info">
    <div class="hero__name-row">
      <h1 class="hero__name">John Doe</h1>
      <i class="hero__verified bxf bx-badge-check" title="Verified artist"></i>
    </div>

    <p class="hero__meta">
      <span>Artist</span>
      <span class="hero__meta-dot" aria-hidden="true"></span>
      <span>Electronic / Ambient / Chillwave</span>
    </p>

    <p class="hero__bio">
      Creating atmospheric soundscapes and electronic journeys for dreamers and night listeners.
    </p>

    <ul class="hero__socials" aria-label="Social links">
      <li>
        <a class="hero__social" href="#" target="_blank" rel="noopener" aria-label="Spotify">
          <i class="bxl bx-spotify"></i>
        </a>
      </li>
      <li>
        <a class="hero__social" href="#" target="_blank" rel="noopener" aria-label="SoundCloud">
          <i class="bxl bx-soundcloud"></i>
        </a>
      </li>
      <li>
        <a class="hero__social" href="#" target="_blank" rel="noopener" aria-label="YouTube">
          <i class="bxl bx-youtube"></i>
        </a>
      </li>
      <li>
        <a class="hero__social" href="#" target="_blank" rel="noopener" aria-label="X">
          <i class="bxl bx-twitter-x"></i>
        </a>
      </li>
    </ul>
  </div>

  <button class="hero__edit" type="button" aria-label="Edit profile">
    <i class="bx bx-pencil"></i>
    <span>Edit Profile</span>
  </button>
</section>
