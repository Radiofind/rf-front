<ul class="stats" [attr.aria-label]="'profile.statistics' | translate">
  <li class="stats__item">
    <i class="stats__icon bx bx-user"></i>
    <div class="stats__content">
      <span class="stats__value">0</span>
      <span class="stats__label">{{ 'profile.followers' | translate }}</span>
    </div>
  </li>

  <li class="stats__item">
    <i class="stats__icon bx bx-arrow-up-circle"></i>
    <div class="stats__content">
      <span class="stats__value">0</span>
      <span class="stats__label">{{ 'profile.uploads' | translate }}</span>
    </div>
  </li>

  <li class="stats__item">
    <i class="stats__icon bx bx-heart"></i>
    <div class="stats__content">
      <span class="stats__value">0</span>
      <span class="stats__label">{{ 'profile.likes' | translate }}</span>
    </div>
  </li>

  <li class="stats__item">
    <i class="stats__icon bx bx-calendar"></i>
    <div class="stats__content">
      <span class="stats__value">{{ registeredAt() }}</span>
      <span class="stats__label">{{ 'profile.joined' | translate }}</span>
    </div>
  </li>
</ul>
