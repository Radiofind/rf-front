<ul class="faq">
  @for (item of items(); track item.id) {
    <li class="faq__item" [class.faq__item--open]="isOpen(item.id)">
      <h3 class="faq__heading">
        <button
          type="button"
          class="faq__question"
          [id]="'faq-question-' + item.id"
          [attr.aria-expanded]="isOpen(item.id)"
          [attr.aria-controls]="'faq-answer-' + item.id"
          (click)="onToggle(item.id)"
        >
          <span class="faq__question-text">{{ item.question | translate }}</span>
          <i class="bx bx-chevron-down faq__chevron" aria-hidden="true"></i>
        </button>
      </h3>
      @if (isOpen(item.id)) {
        <div
          class="faq__answer"
          role="region"
          [id]="'faq-answer-' + item.id"
          [attr.aria-labelledby]="'faq-question-' + item.id"
        >
          <p>{{ item.answer | translate }}</p>
        </div>
      }
    </li>
  }
</ul>
