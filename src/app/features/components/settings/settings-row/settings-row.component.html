<div class="row">
  <i class="row__icon" [class]="iconClass()" aria-hidden="true"></i>

  <div class="row__info">
    <h3 class="row__title" [id]="rowId() + '-title'">{{ rowTitle() }}</h3>
    <p class="row__description" [id]="rowId() + '-description'">{{ rowDescription() }}</p>
  </div>

  <div class="row__control">
    <ng-content />
  </div>
</div>
