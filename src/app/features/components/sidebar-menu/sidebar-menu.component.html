<aside class="sidebar" [class.sidebar--collapsed]="isCollapsed()">
  <div class="sidebar__head">
    <button
      class="sidebar__toggle"
      type="button"
      [attr.aria-label]="toggleAriaLabel() | translate"
      [attr.aria-expanded]="!isCollapsed()"
      aria-controls="sidebar-navigation"
      [title]="toggleAriaLabel() | translate"
      (click)="onToggleCollapsed()"
    >
      <i [class]="toggleIconClass()"></i>
    </button>
  </div>

  <nav
    class="sidebar__nav"
    id="sidebar-navigation"
    [attr.aria-label]="'sidebar.mainNavigation' | translate"
  >
    <ul class="sidebar__list">
      @for (item of visibleMenuItems(); track item.id) {
        <li>
          <a
            #itemLink="routerLinkActive"
            class="sidebar__item"
            routerLinkActive="sidebar__item--active"
            [routerLink]="item.link"
            [attr.aria-current]="itemLink.isActive ? 'page' : null"
            [title]="item.label | translate"
          >
            <i class="sidebar__item-icon" [class]="item.iconClass"></i>
            <span class="sidebar__item-label">{{ item.label | translate }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <button
    class="sidebar__user"
    type="button"
    [attr.aria-label]="'sidebar.openAccountSettings' | translate"
    (click)="onProfile()"
  >
    <span class="sidebar__user-avatar">
      @if (userAvatarUrl()) {
        <img
          class="sidebar__user-image"
          [src]="userAvatarUrl()"
          [alt]="'common.userAvatar' | translate"
        />
      } @else {
        <i class="bxf bx-user"></i>
      }
      @if (isUserOnline()) {
        <span class="sidebar__user-status"></span>
      }
    </span>

    <span class="sidebar__user-info">
      <span class="sidebar__user-name">{{ userName() }}</span>
      <span class="sidebar__user-email">{{ userEmail() }}</span>
    </span>

    <i class="sidebar__user-arrow bx bx-chevron-right"></i>
  </button>
</aside>
