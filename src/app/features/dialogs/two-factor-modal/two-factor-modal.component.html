<div class="two-factor">
  <div class="two-factor__badge">
    <span class="two-factor__ring"></span>
    <span class="two-factor__ring two-factor__ring--outer"></span>
    <i class="two-factor__shield bx bx-shield"></i>
    <i class="two-factor__lock bx bx-lock-keyhole"></i>
  </div>

  <h2 class="two-factor__title">{{ 'twoFactor.title' | translate }}</h2>

  <p class="two-factor__description">
    {{ 'twoFactor.descriptionStart' | translate }}
    <span class="two-factor__email">{{ data.email }}</span
    >{{ 'twoFactor.descriptionEnd' | translate }}
  </p>

  <app-code-field
    class="two-factor__code"
    name="two-factor-code"
    [value]="code()"
    [codeLength]="6"
    [errors]="codeErrors()"
    [touched]="hasCodeError()"
    (valueChange)="onCodeChange($event)"
  />

  <app-button
    contentIconClass="bx bx-arrow-right-stroke"
    [contentText]="'twoFactor.submit' | translate"
    [disabled]="!isCodeComplete() || isLocked()"
    (clickAction)="onVerify()"
  />

  <p class="two-factor__resend">
    {{ 'twoFactor.noCode' | translate }}
    @if (isResending()) {
      <app-spinner class="two-factor__resend-spinner" size="20px" thickness="2px" />
    } @else {
      <button
        class="two-factor__resend-action"
        type="button"
        [disabled]="!canResend() || isLocked()"
        (click)="onResend()"
      >
        {{ 'twoFactor.resend' | translate }}
        @if (!canResend() && !isLocked()) {
          ({{ resendTimer() }})
        }
      </button>
    }
  </p>
</div>
