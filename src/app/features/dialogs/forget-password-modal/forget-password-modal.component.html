<div class="forgot-password">
  <div class="forgot-password__badge">
    <span class="forgot-password__ring"></span>
    <span class="forgot-password__ring forgot-password__ring--outer"></span>
    <i class="forgot-password__mail" [class]="mailIconClass"></i>
  </div>

  <h2 class="forgot-password__title">Forgot Your Password?</h2>

  <p class="forgot-password__description">
    No worries! Enter your email address and we'll send you a link to reset your password.
  </p>

  <form class="forgot-password__form" [formRoot]="forgetPasswordForm">
    <app-input-field
      [formField]="forgetPasswordForm.email"
      [fieldLabel]="'Email Address'"
      [iconClass]="'bx bx-envelope-alt'"
      [inputType]="'email'"
      [inputPlaceholder]="'you@example.com'"
    />
  </form>

  <app-button
    [contentText]="'Send Reset Link'"
    [contentIconClass]="submitIconClass"
    [disabled]="forgetPasswordForm().invalid() || forgetPasswordForm().submitting()"
    (clickAction)="sendResetLink()"
  />
</div>
