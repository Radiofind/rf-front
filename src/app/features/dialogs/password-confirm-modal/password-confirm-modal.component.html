<form class="password-confirm" (submit)="$event.preventDefault(); onConfirm()">
  <p class="password-confirm__message">{{ data.message | translate }}</p>

  @if (data.description) {
    <p class="password-confirm__description">{{ data.description | translate }}</p>
  }

  <app-input-field
    class="password-confirm__field"
    name="current-password"
    iconClass="bx bx-lock"
    [fieldLabel]="'accountSettings.passwordLabel' | translate"
    [inputPlaceholder]="'auth.fields.passwordPlaceholder' | translate"
    [inputType]="isPasswordVisible() ? 'text' : 'password'"
    [hasInputAction]="true"
    [inputActionIconClass]="isPasswordVisible() ? 'bx bx-eye' : 'bx bx-eye-slash'"
    [value]="password()"
    [errors]="errors()"
    [touched]="hasError()"
    (valueChange)="onPasswordChange($event)"
    (inputActionEmiter)="onTogglePasswordVisibility()"
  />

  <div class="password-confirm__actions">
    <app-button
      [contentText]="'common.cancel' | translate"
      additionalClass="button--secondary button--compact"
      (clickAction)="onCancel()"
    />

    <app-button
      buttonType="submit"
      [contentText]="data.confirmText | translate"
      [additionalClass]="data.isDanger ? 'button--compact button--danger' : 'button--compact'"
      [disabled]="!canSubmit()"
    />
  </div>
</form>
