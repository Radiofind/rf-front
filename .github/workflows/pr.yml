name: Pull Request CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --no-watch

      - name: Build
        run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: radiofind
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Catches the two-factor and password-reset emails instead of sending them via Gmail.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          repository: AlexanderHanziuk/rf-back
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package

      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar "$(ls target/*.jar | grep -v plain | head -n 1)" \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/radiofind \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --spring.jpa.show-sql=false \
            --spring.mail.host=localhost \
            --spring.mail.port=1025 \
            --spring.mail.username= \
            --spring.mail.password= \
            --spring.mail.properties.mail.smtp.auth=false \
            --spring.mail.properties.mail.smtp.starttls.enable=false \
            --jwt.secret="$(openssl rand -hex 32)" \
            > "$RUNNER_TEMP/backend.log" 2>&1 &

          # No actuator: any HTTP status (401/403 included) means the server is up.
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api)" != "000" ]; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not start in time"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.results/
          retention-days: 7

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 7
